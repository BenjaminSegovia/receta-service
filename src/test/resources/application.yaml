spring:
  application:
    name: receta-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Mismos endpoints públicos que en producción (health e info)
management:
  endpoints:
    web:
      exposure:
        include: health, info
